# Publica una versión al empujar una etiqueta v* (p. ej. v1.2.0):
#   · comprueba que la etiqueta, la versión de la app y el CHANGELOG coinciden,
#   · compila el instalador de Windows (NSIS) y la app de macOS (Apple Silicon),
#   · los adjunta a una GitHub Release con las novedades de esa versión del CHANGELOG,
#   · y, si están los secretos de firma, genera latest.json para el actualizador integrado.
#
# Preparación (una vez): npm run updater:setup -- --repo <usuario>/<repositorio>
# y añade los secretos TAURI_SIGNING_PRIVATE_KEY y TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# Detalles en docs/ACTUALIZACIONES.md.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Comprobar la versión y leer sus novedades
        id: version
        shell: bash
        run: node scripts/check-version.mjs ${{ github.ref_type == 'tag' && format('--tag {0}', github.ref_name) || '' }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Lanzado a mano (workflow_dispatch), la etiqueta sale de la versión de package.json.
          tagName: v${{ steps.version.outputs.version }}
          releaseName: AudioExtract ${{ steps.version.outputs.version }}
          # También es el texto del aviso de actualización dentro de la app.
          releaseBody: |
            ${{ steps.version.outputs.notes }}

            ---
            Si ya tienes AudioExtract instalado, ejecuta el instalador nuevo encima (conserva tu
            biblioteca) o actualiza desde la propia app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Sin secretos de firma se publica igual, pero sin artefactos para el actualizador.
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.release.conf.json' || '' }}
